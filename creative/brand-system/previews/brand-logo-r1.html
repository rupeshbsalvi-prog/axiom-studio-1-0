<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Axiom Brand Logo R1</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #f5f7fb; background: #07090c; font: 14px/1.5 Inter, system-ui, sans-serif; }
      main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 52px 0 72px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: clamp(30px, 5vw, 64px); letter-spacing: -.055em; }
      p { margin: 6px 0 0; color: #9ca5b5; }
      .badge { color: #94f4da; border: 1px solid #264b44; border-radius: 999px; padding: 7px 11px; }
      .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 18px; }
      .card { overflow: hidden; border: 1px solid #202630; border-radius: 24px; background: #0d1117; }
      .hero { min-height: 680px; display: grid; place-items: center; padding: 38px; }
      .hero img { width: min(100%, 660px); height: auto; display: block; border-radius: 18px; }
      .sizes { display: grid; align-content: start; gap: 18px; }
      .sample { padding: 20px; }
      .sample img { display: block; width: 100%; height: auto; border-radius: 12px; }
      .sample.small img { width: 96px; }
      .label { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; color: #b9c0cc; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .hero { min-height: auto; } header { align-items: start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Brand Logo R1</h1><p>Exact supplied artwork · optical square crop · responsive raster ladder</p></div>
        <span class="badge">Candidate — approval required</span>
      </header>
      <section class="grid">
        <article class="card hero"><img src="../assets/logos/r1/axiom-logo-hero-2048.webp" alt="Axiom Studio creative ecosystem emblem" /></article>
        <div class="sizes">
          <article class="card sample"><img src="../assets/logos/r1/axiom-logo-display-1024.webp" alt="Display logo sample" /><div class="label"><span>Display</span><span>1024 WebP</span></div></article>
          <article class="card sample small"><img src="../assets/logos/r1/axiom-logo-app-icon-512.png" alt="App icon sample" /><div class="label"><span>UI scale</span><span>96 px preview</span></div></article>
        </div>
      </section>
    </main>
  </body>
</html>
