services:
  - type: web
    name: axiom-studio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: AXIOM_RUNTIME_DATA_DIR
        value: /tmp/axiom-runtime
      - key: AXIOM_SECURE_COOKIES
        value: "true"
      - key: AXIOM_ENABLE_OPENAI_IMAGE_PROVIDER
        value: "false"
      - key: AXIOM_PHOTO_GATEWAY_ACCESS_TOKEN
        generateValue: true
      - key: AXIOM_ASSET_SIGNING_SECRET
        generateValue: true
      - key: AXIOM_SUPABASE_URL
        sync: false
      - key: AXIOM_SUPABASE_PUBLISHABLE_KEY
        sync: false
